name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for source tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run browser capture and quality tests
        run: |
          cd tools/quality-tests
          node test_scan_sources.js
          node test_scan_api.js
          node test_scan_hls_payload.js
          node QualityMapConfigTest.js
          node test_early_api_capture.js
          node test_early_api_pipeline.js
          node test_frame_video_capture.js
          node test_frame_probe_shadow.js
          node test_preroll_gate.js
          node test_stage35_invariants.js
          node test_xhamster_sources.js
          node test_ytdlp_integration.js
          node test_pornhub_request_context.js
          node test_ytdlp_curl_runtime.js
          node test_revision_regressions.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download and verify ARM64 Python/curl_cffi and yt-dlp runtime
        run: bash tools/prepare_android_runtime.sh

      - name: Build the single VideoBrowser APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify the single APK contains the ARM64 Python runtime
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libpython\.so$'
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libpython\.zip\.so$'
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libqjs\.so$'

      - name: Upload the single APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoBrowser-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
